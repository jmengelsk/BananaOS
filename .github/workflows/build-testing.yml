name: Build BananaOS Testing

on:
  push:
    branches:
      - 'bananaos'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        build_type: [decrypted]
      fail-fast: false

    steps:
      - name: Checking out repo
        uses: actions/checkout@v7
        with:
          ref: bananaos
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Configuring build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_ota.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_ota.x509.pem          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/aosp_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/aosp_platform.x509.pem

      - name: Install Kernel build tools
        run: |
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            unzip \
            wget \
            zip \
            zstd \
            bzip2
     
      - name: Cache clang
        id: cache-clang
        uses: actions/cache@v6
        with:
          path: llvm-22
          key: llvm-22.1.4-slim

      - name: Download Slim LLVM and Build Kernel
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          cd ./external/kernel/samsung/sm-m515
          wget -O llvm.tar.gz https://www.kernel.org/pub/tools/llvm/files/llvm-22.1.4-x86_64.tar.gz          
          mkdir llvm-22;
          tar -C llvm-22 --strip-components=1 -xzf llvm.tar.gz
          rm llvm.tar.gz
          make mrproper
          bash build.sh m51 m51nsxx sdmmagpie y
          cd AnyKernel3
          zip -r ../BananaOS-Kernel.zip .

      - name: JDK 21 Setup
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Building dependencies
        run: |
          source ./buildenv.sh m51
          ./scripts/build_dependencies.sh

      - name: Downloading required Stock Firmware files
        run: |
          source ./buildenv.sh m51
          ./scripts/download_fw.sh

      - name: Extracting downloaded Stock Firmware files
        run: |
          source ./buildenv.sh m51
          ./scripts/extract_fw.sh

      - name: Configuring encryption state
        if: matrix.build_type == 'encrypted'
        run: |
          source ./buildenv.sh m51
          touch target/m51/patches/dfe/disable
          sed -i 's|decrypted|encrypted|g' scripts/build_flashable_zip.sh

      - name: Building ROM
        run: |
          source ./buildenv.sh m51
          ./scripts/make_rom.sh --build-rom-zip

      - name: Uploading  Build to SourceForge
        env:
          SF_M51_TESTING_PATH: ${{ secrets.SF_M51_TESTING_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SF_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts
          for ROM in out/Banana*.zip; do
            echo "Uploading $ROM to SourceForge..."
            scp -i ~/.ssh/id_rsa $ROM $SF_M51_TESTING_PATH           
          done
