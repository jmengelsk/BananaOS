name: CI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        build_type: [decrypted]
        target: [m51]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp shellcheck
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_ota.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_ota.x509.pem
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/aosp_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/aosp_platform.x509.pem

      - name: Install Kernel build tools
        run: |
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            unzip \
            wget \
            zip \
            zstd \
            libbz2-dev \
            libbz2-1.0 \
            bzip2

      - name: Cache clang
        id: cache-clang
        uses: actions/cache@v6
        with:
          path: llvm-22
          key: llvm-22.1.4-slim

      - name: Download Slim LLVM and Build Kernel
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          cd ./external/kernel/samsung/sm-m515
          wget -O llvm.tar.gz https://www.kernel.org/pub/tools/llvm/files/llvm-22.1.4-x86_64.tar.gz          
          mkdir llvm-22;
          tar -C llvm-22 --strip-components=1 -xzf llvm.tar.gz
          rm llvm.tar.gz
          make mrproper
          bash build.sh m51 m51nsxx sdmmagpie y
          cd AnyKernel3
          zip -r ../BananaOS-Kernel.zip .

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh m51
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Configure encryption state
        if: matrix.build_type == 'encrypted'
        run: |
          source ./buildenv.sh m51
          touch target/m51/patches/dfe/disable
          sed -i 's|decrypted|encrypted|g' scripts/build_flashable_zip.sh

      - name: Build ROM
        run: ./scripts/make_rom.sh --build-rom-zip


      - name: Uploading  ROM to SourceForge
        env:
          SF_M51_PATH: ${{ secrets.SF_M51_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SF_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts
          for ROM in out/Banana*.zip; do
            echo "Uploading $ROM to SourceForge..."
            scp -i ~/.ssh/id_rsa $ROM $SF_M51_PATH
          done
