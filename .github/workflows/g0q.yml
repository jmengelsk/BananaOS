name: Galaxy S22+ (Snapdragon) (g0q)

on:
  workflow_dispatch:

jobs:
  build:
    name: BananaOS
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [decrypted]
        target: [g0q]
#        target: [a52q, a52sxq, a71, a72q, a73xq, b0q, g0q, m51, m52xq, o1s, p3s, r0q, r8q, r9s, t2s]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          repository: jmengelsk/BananaOS_backend
          token: ${{ secrets.GH_JOJO_TOKEN }}
          ref: mooning3
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Setting up Build Environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp shellcheck
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem
          echo -n "${{ secrets.OTA_KEY_PK8 }}" | base64 --decode > security/unica_ota.pk8
          echo -n "${{ secrets.OTA_KEY_PEM }}" | base64 --decode > security/unica_ota.x509.pem

      - name: Setting up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Generating  Build Config for  ${{ matrix.target }}
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Building Dependencies
        run: ./scripts/build_dependencies.sh

      - name: Downloading Stock Firmware(s)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extracting Stock Firmware(s)
        run: ./scripts/extract_fw.sh

      - name: Configuring Encryption State
        if: matrix.build_type == 'encrypted'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          touch unica/patches/dfe/disable
          sed -i 's|decrypted|encrypted|g' scripts/build_flashable_zip.sh

      - name: Building ${{ matrix.target }} ROM
        run: ./scripts/make_rom.sh -z


      - name: Uploading ${{ matrix.target }} ROM to SourceForge
        env:
          SF_BANANA_PATH: ${{ secrets.SF_BANANA_PATH }}
        run: |
          ./scripts/gen_json.sh
          mkdir -p ~/.ssh
          echo "${{ secrets.SF_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts
          for ROM in out/Banana*.zip; do
            echo "Uploading $ROM to SourceForge..."
            scp -i ~/.ssh/id_rsa ./out/$TARGET_CODENAME.json $SF_BANANA_PATH/Samsung/3.2.x/json/
            scp -i ~/.ssh/id_rsa $ROM $SF_BANANA_PATH/Samsung/3.2.x/
          done
